            <path d="M42,21 L42,19 C42,17.3 45,17.3 45,19 L45,21" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
            <circle cx="44" cy="24" r="1" fill="rgba(200,50,70,1)"/>
        </g>
    </g>
