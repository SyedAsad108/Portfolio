<?xml version="1.0" encoding="UTF-8"?>
<svg width="80px" height="80px" viewBox="0 0 80 80" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient x1="0%" y1="100%" x2="100%" y2="0%" id="iam-grad">
            <stop stop-color="#BF0683" offset="0%"></stop>
            <stop stop-color="#DD344C" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect fill="url(#iam-grad)" x="0" y="0" width="80" height="80"></rect>
        <g transform="translate(13, 10)" fill="#FFFFFF">
            <!-- IAM icon: person + shield/lock -->
            <!-- Person (user) shape -->
            <circle cx="27" cy="18" r="7"/>
            <path d="M12,42 C12,33.7 18.7,27 27,27 C35.3,27 42,33.7 42,42 L42,44 L12,44 Z"/>
            <!-- Shield/lock to the right top -->
